protocol: ChainedHotstuff
timers:
  view_change_ms: 8000

# Learning-agent integration (wall-clock learning cycle).
# Each episode: collect features for feature_duration_ms, wait reply_wait_ms
# for the agent's recommendation, apply it and discard warmup_duration_ms,
# then collect the reward for reward_duration_ms.
agent:
  enabled: false
  ports:
    1: 50100
    2: 50101
    3: 50102
    4: 50103
  feature_duration_ms: 8000
  reply_wait_ms: 2000
  warmup_duration_ms: 2000
  reward_duration_ms: 8000
  poll_interval_ms: 50
  rpc_timeout_ms: 500
phases:
  Request: 
    quorum: 1
    next_state: Prepare
    actions:
      - verifySignature:
          public_key: "../keys/${client_id}_public.pem"
      - "checkNewViewQuorum"
      - "handleClientRequestAsLeader"
  Prepare:
    quorum: 1
    next_state: PreCommit
    actions:
      - "sendNewViewToNextLeader"
      - "checkQC"
      - "startTimer"
      - "storeMessage"
      - "storePiggyback"
  PreCommit:
    quorum: 2f+1
    next_state: Commit
    actions:
      - "checkQC"
      - "resetTimer"
      - "storeMessage"
      - "checkQuorum"
      - "storePiggyback"
  Commit:
    quorum: 2f+1
    next_state: Decide
    actions:
      - "checkQC"
      - "resetTimer"
      - "storeMessage"
      - "checkQuorum"
      - "UpdateLockedQC"
      - "storePiggyback"
  Decide:
    quorum: 2f+1
    next_state: Request
    actions:
      - "checkQC"
      - "stopTimer"
      - "storeMessage"
      - "checkQuorum"
      - "complete"
      

  ViewChange:
    quorum: 2f+1
    next_state: Request
    actions:
      - "handleViewChangeHotstuff"
  NewView:
    quorum: 1
    next_state: Request
    actions:
      - "handleNewView"

  NewViewforHotstuff:
    quorum: 1
    next_state: Request
    actions:
      - "storeNewViewMessage"

  QueryBalances:
    quorum: 1
    next_state: Request
    actions:
      - "queryBalances"