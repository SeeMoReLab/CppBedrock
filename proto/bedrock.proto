syntax = "proto3";

package bedrock;

message RawJson {
  string json = 1;
}

message Transaction {
  string from = 1;
  string to = 2;
  int32 amount = 3;
}

// New lightweight aggregated message for quorum piggyback
message AggregatedMessage {
  int32 view = 1;
  int32 sequence = 2;
  string digest = 3;
  int32 message_sender_id = 4;
  string signature = 5;
  int32 client_listen_port = 6;
  string clientid = 7;
  string timestamp = 8;
  Transaction transaction = 9;
}

message ClientRequest {
  string message_sender_id = 1;
  string timestamp = 2;
  Transaction transaction = 3;
  int32 view = 4;
  string operation = 5;
  int32 client_listen_port = 6;
  string signature = 7;
}

message PrePrepare {
  int32  view               = 1;
  int32  sequence           = 2;
  string operation          = 3;
  string timestamp          = 4;
  int32  client_listen_port = 5;
  Transaction transaction   = 6;
  string signature          = 7;
  int32  message_sender_id  = 8;
  string client_id          = 9;
  repeated AggregatedMessage combined_messages = 10;
  string qc = 11;
  string type = 12; // NEW: mirrors JSON "type" (e.g., "PrePrepare")
  repeated AggregatedMessage batch_requests = 13; // batched client requests
}

message Prepare {
  int32  view               = 1;
  int32  sequence           = 2;
  string operation          = 3;
  int32  message_sender_id  = 4;
  repeated AggregatedMessage combined_messages = 5;
  string qc = 6;
  string type = 7; // NEW
}

message Commit {
  int32  view               = 1;
  int32  sequence           = 2;
  string operation          = 3;
  int32  message_sender_id  = 4;
  repeated AggregatedMessage combined_messages = 5;
  string qc = 6;
  string type = 7; // NEW
}

message ProtocolEnvelope {
  oneof payload {
    PrePrepare pre_prepare = 1;
    Prepare prepare = 2;
    Commit commit = 3;
  }
}

message Ack {
  bool ok = 1;
  string msg = 2;
}

service Node {
  // Existing raw JSON endpoint (kept for other scenarios)
  rpc SendRawJson (RawJson) returns (RawJson);

  // New typed endpoint used by scenario 4
  rpc SubmitRequest (ClientRequest) returns (Ack);

  // New typed inter-node RPC for basic phases
  rpc SendProtocol (ProtocolEnvelope) returns (Ack);
}