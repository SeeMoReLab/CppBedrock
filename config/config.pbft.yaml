# PBFT uses the authenticated engine in EntityConsensus.cpp.
# Phase prerequisites and quorum thresholds are protocol invariants in C++.
# YAML configures timers and the client entry point only.
protocol: PBFT
timers:
  view_change_ms: 8000
phases:
  Request:
    next_state: PrePrepare
    actions:
      - "handleClientRequest"
  QueryBalances:
    next_state: Request
    actions:
      - "queryBalances"
